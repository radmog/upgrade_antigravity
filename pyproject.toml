[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-updater"
version = "0.4.0"
description = "Instalador e atualizador do Antigravity para Linux"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# Nesta primeira etapa, bloqueia erros objetivos sem impor uma reformatação
# completa aos scripts legados.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = false
ignore_missing_imports = true
warn_unused_configs = true
