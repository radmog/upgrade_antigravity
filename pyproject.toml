[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-updater"
version = "1.1.0"
description = "Instalador e atualizador do Antigravity para Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ricardo Augusto de Morais Guedes" }]
keywords = ["antigravity", "updater", "linux", "systemd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/radmog/upgrade_antigravity"
Repository = "https://github.com/radmog/upgrade_antigravity.git"
Issues = "https://github.com/radmog/upgrade_antigravity/issues"

[project.scripts]
antigravity-upgrade = "antigravity_updater.cli:main"

[tool.setuptools.packages.find]
include = ["antigravity_updater*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# Nesta primeira etapa, bloqueia erros objetivos sem impor uma reformatação
# completa aos scripts legados.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = false
ignore_missing_imports = true
warn_unused_configs = true
